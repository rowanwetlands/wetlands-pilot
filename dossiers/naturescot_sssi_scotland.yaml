dataset_id: naturescot_sssi_scotland
site: montrose
title: NatureScot SSSI Scotland (EPSG:27700, GeoPackage)
description: >
  NatureScot Sites of Special Scientific Interest — Scotland-wide polygon dataset.
  Single layer SSSI_SCOTLAND, 15877 features, EPSG:27700.
  Source for Montrose Basin SSSI boundary (PA_CODE 1184, 9.51 km², Status: Current).
  Full Scotland dataset archived as received; Montrose extraction is a derivative.
  Contains Ordnance Survey data — attribution required (see provenance.attribution).
  Layer updated 2025-10-16; Montrose feature last updated 2018-10-08.

