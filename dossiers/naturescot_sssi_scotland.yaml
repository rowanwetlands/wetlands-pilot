model_role:
  tier: reference_boundary
  role: sssi_boundary
  use: >
    Authoritative legal boundary of Montrose Basin SSSI (PA_CODE 1184).
    Used to define the core study area extent and as a reference frame for
    all spatial analysis. The full Scotland GPKG is archived as received;
    the Montrose feature (PA_CODE=1184) is extracted as a derivative at
    boundary/derived/naturescot_sssi_montrose_1184.gpkg.
  dependencies:
    requires: []
    feeds:
      - AOI definition (core SSSI boundary)
      - terrain raster clip extent
      - historical boundary regression reference frame

readiness:
  band: "C"
  readiness_by_role:
    sssi_boundary: "—"

storage:
  bucket: wetlands-raw-rowan
  key_prefix: montrose/naturescot_sssi_scotland/2026-07-17__SSSI_SCOTLAND/
  checksums_file: _checksums.sha256
  sha256_gpkg: 553790bb8b305e8bcaec889cb1701d3972faabacd2159e28f058c8c07157f6cb
  bytes_gpkg: 76546048  # 73M — verify against actual after upload

flags:
  - Full Scotland dataset archived; Montrose extraction (PA_CODE 1184) is a derivative — do not treat gpkg as Montrose-only
  - SSSI_SCOTLAND_GPKG_27700.zip: assumed repackaging of same EPSG:27700 data — confirm CRS on unzip before use
  - Attribution required on any publication using this data (see provenance.attribution)
  - Montrose feature updated 2018-10-08 — check NatureScot for any subsequent boundary revisions before treating as current legal boundary
  - .lyr/.lyrx/.sld are style files, not geometry; archived as received

technical_notes:
  derivative_extraction: >
    Extract Montrose feature at derivative stage:
    ogr2ogr -where "PA_CODE = 1184" \
      boundary/derived/naturescot_sssi_montrose_1184.gpkg \
      <raw_path>/SSSI_SCOTLAND.gpkg
    DVC-track the derivative, not the raw.
  crs_note: >
    Native EPSG:27700 — no reprojection needed for project pipeline.
    No vertical component (boundary polygon, 2D only).
  zip_note: >
    SSSI_SCOTLAND_GPKG_27700.zip not unpacked during intake — archived as received.
    Unzip and inspect CRS before use; do not assume identical to .gpkg without verification.

